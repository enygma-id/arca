# SPDX-License-Identifier: AGPL-3.0-only
name: CI
on:
  push:
    branches: ["main", "beta", "release/*"]
  pull_request:
    branches: ["main", "beta"]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies from lockfile
        run: uv sync --python ${{ matrix.python }} --extra dev --extra server --locked

      - name: Lint and format check
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: Run test suite
        run: uv run --python ${{ matrix.python }} pytest

  samples-e2e:
    name: samples-e2e (ubuntu-latest, py3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies from lockfile
        run: uv sync --extra dev --extra server --locked

      - name: Verify CLI inspect on Sample IFC
        run: uv run python -m arca inspect samples/arca-sample-area-01/data/arca_synthetic_mall_10f.ifc

      - name: Verify CLI inspect on Sample SKP
        run: uv run python -m arca inspect samples/arca-sample-area-02/data/arca_synthetic_mall_10f.skp

  uv-workflow:
    name: uv-workflow (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.12 via uv
        run: uv python install 3.12

      - name: Sync dependencies from lockfile
        run: uv sync --extra dev --extra server --locked

      - name: Verify package version
        run: uv run python -c "import arca; print(arca.__version__)"

      - name: Run test suite via uv
        run: uv run pytest
