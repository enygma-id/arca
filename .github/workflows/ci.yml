# SPDX-License-Identifier: AGPL-3.0-only
name: CI
on:
  push:
    branches: ["main", "release/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@0a5c32733d2d47e7d2c48f81abb5bad4a5d0fddf # v5.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,server]"

      - name: Lint and format check
        run: ruff check .

      - name: Run test suite
        run: pytest

  samples-e2e:
    name: samples-e2e (ubuntu-latest, py3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0a5c32733d2d47e7d2c48f81abb5bad4a5d0fddf # v5.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,server]"

      - name: Verify CLI inspect on Sample IFC
        run: python -m arca inspect samples/arca-sample-area-01/data/arca_synthetic_mall_10f.ifc

      - name: Verify CLI inspect on Sample SKP
        run: python -m arca inspect samples/arca-sample-area-02/data/arca_synthetic_mall_10f.skp

  uv-workflow:
    name: uv-workflow (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Set up Python 3.12 via uv
        run: uv python install 3.12

      - name: Sync dependencies from lockfile
        run: uv sync --extra dev --extra server --locked

      - name: Verify package version
        run: uv run python -c "import arca; print(arca.__version__)"

      - name: Run test suite via uv
        run: uv run pytest
