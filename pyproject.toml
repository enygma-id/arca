[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arca"
version = "0.2.0"
description = "ARCA BIM-to-GIS ingestion and 3D geospatial visualization engine"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = [
  "numpy>=1.24",
  "shapely>=2.0",
  "pyproj>=3.5",
  "openskp>=1.2.0",
]

[project.optional-dependencies]
server = ["fastapi", "uvicorn", "python-multipart"]
dev = ["pytest", "pytest-cov", "ruff", "httpx", "fastapi", "uvicorn", "python-multipart"]

[project.scripts]
arca = "arca.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arca"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
exclude = ["/.cache", "/.venv", "/dist", "/arca_workspace", "/outputs"]
